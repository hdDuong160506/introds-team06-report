name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Serve links and assets under the report repository's URL path.
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out report source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Jupyter Book
        run: python -m pip install "jupyter-book==2.1.7"

      - name: Build report as static HTML
        run: jupyter-book build --html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
